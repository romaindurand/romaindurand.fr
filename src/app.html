<!doctype html>
<html lang="fr">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<link rel="preload" href="/SudoVariable.woff2" as="font" type="font/woff" crossorigin />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(function () {
				const savedTheme = localStorage.getItem('theme');
				const userPreferedTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
					? 'dark'
					: 'light';

				const theme = savedTheme || userPreferedTheme;

				document.documentElement.setAttribute('data-theme', theme);
			})();
		</script>
		<script
			defer
			src="https://umami.romaindurand.fr/script.js"
			data-website-id="497f6cec-6d46-4fe1-9243-0d7dcac02d24"
		></script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
